schemaVersion: 1
updatedAt: 2026-08-09
policy:
  nodePackageManager: pnpm
  lockfile: pnpm-lock.yaml
  rustChannel: stable-pinned
  productionUsesPrereleaseDependencies: false

toolchain:
  node:
    supportedLine: "24 LTS"
    version: "24.18.1"
    status: supported
  pnpm:
    supportedLine: "11.x"
    version: "11.21.0"
    status: supported
  rust:
    version: "1.88.0"
    status: supported

frontend:
  next:
    roadmapLine: "16.3.x"
    version: "16.2.11"
    status: temporary-compatibility-exception
    note: "16.3 remained Preview in the latest official release evidence inspected on 2026-08-09; 16.2.11 was the patched Active LTS line. Do not promote Preview merely to match the roadmap text."
  react:
    supportedLine: "19.2.x"
    version: "19.2.8"
  reactDom:
    supportedLine: "19.2.x"
    version: "19.2.8"
  typescript:
    supportedLine: "6.0.x"
    version: "6.0.2"
  tailwindCss:
    supportedLine: "4.3.x"
    version: "4.3.0"
  valibot:
    version: "1.4.2"

containers:
  postgres: "postgres:17.6-bookworm"
  redis: "redis:8.2.1-alpine"
  mongo: "mongo:8.3.7"
  rabbitmq: "rabbitmq:4.1.4-management-alpine"

validation:
  exactNodePinFiles:
    - .node-version
    - .github/workflows/ci.yml
  exactPnpmPinFiles:
    - package.json
    - .github/workflows/ci.yml
  notes:
    - "Exact package availability and the generated pnpm-lock.yaml must be validated in an environment with access to the public registry before this draft PR can be marked ready."
