name: openapi-canonicalize-temp

on:
  push:
    branches: ["agent/frontend-product-shell"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/frontend-product-shell
          fetch-depth: 0
      - name: Generate versioned OpenAPI and TypeScript contract
        run: |
          python3 scripts/generate_frontend_contract.py
          rm .github/workflows/openapi-canonicalize-temp.yml
      - name: Commit generated contract
        run: |
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add apps/frontend/public/openapi-v1.json apps/frontend/src/generated/api-contract.ts .github/workflows/openapi-canonicalize-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: materialize OpenAPI contract"
          git push origin HEAD:agent/frontend-product-shell
