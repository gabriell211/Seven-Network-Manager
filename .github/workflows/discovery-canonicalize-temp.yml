name: discovery-canonicalize-temp

on:
  push:
    branches: ["agent/frontend-product-shell"]

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/frontend-product-shell
          fetch-depth: 0
      - name: Resolve pinned Rust toolchain
        run: rustup show
      - name: Generate lockfile and rustfmt only
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Commit canonical files
        run: |
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add Cargo.lock Cargo.toml apps crates
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: canonicalize discovery Rust graph"
          git push origin HEAD:agent/frontend-product-shell
