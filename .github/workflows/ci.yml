name: ci

on:
  pull_request:
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read
  issues: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository boundaries
        run: python3 scripts/validate_repo.py
      - name: Validate machine-readable roadmap
        run: python3 scripts/validate_roadmap.py
      - name: Verify issue mirror has no GitHub drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp docs/roadmap.json /tmp/roadmap.json
          python3 scripts/sync_roadmap.py
          diff -u /tmp/roadmap.json docs/roadmap.json
      - name: Require reproducible lockfiles
        run: test -f pnpm-lock.yaml && test -f Cargo.lock
      - name: Validate reference deployment
        env:
          POSTGRES_PASSWORD: snm-ci-only-password
          SNM_RUNTIME_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef
          SNM_ACCESS_TOKEN_KEY: abcdef0123456789abcdef0123456789abcdef0123456789
          MONGO_INITDB_ROOT_PASSWORD: snm-ci-only-mongo-password
        run: docker compose config --quiet

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: snm
          POSTGRES_PASSWORD: snm-ci-only-password
          POSTGRES_DB: snm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snm -d snm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.1-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://snm:snm-ci-only-password@127.0.0.1:5432/snm_ci
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v6
      - name: Resolve pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test migrations, domain and runtime contracts
        run: cargo test --workspace --all-targets --locked
      - name: Build production binaries
        run: cargo build --workspace --bins --locked
      - name: Smoke authenticated control-plane to site-runtime
        shell: bash
        env:
          SNM_RUNTIME_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef
          SNM_RUNTIME_BIND: 127.0.0.1:9765
          SNM_RUNTIME_URL: http://127.0.0.1:9765
          SNM_BACKEND_BIND: 127.0.0.1:8080
          SNM_RUN_MIGRATIONS: "true"
          SNM_ACCESS_TOKEN_KEY: abcdef0123456789abcdef0123456789abcdef0123456789
          SNM_AUTH_ISSUER: snm
          SNM_AUTH_AUDIENCE: snm-api
          SNM_AUTH_COOKIE_SECURE: "false"
          SNM_INVENTORY_REQUIRE_APPROVAL: "true"
          SNM_BOOTSTRAP_ORG_SLUG: ci-smoke
          SNM_BOOTSTRAP_ORG_NAME: CI Smoke Organization
          SNM_BOOTSTRAP_SITE_SLUG: default
          SNM_BOOTSTRAP_SITE_NAME: CI Smoke Site
          SNM_BOOTSTRAP_ADMIN_EMAIL: admin@ci.invalid
          SNM_BOOTSTRAP_ADMIN_NAME: CI Administrator
          SNM_BOOTSTRAP_ADMIN_PASSWORD: CI-only-Strong-Password-2026!
        run: |
          set -euo pipefail
          target/debug/snm-site-runtime > /tmp/snm-runtime.log 2>&1 &
          runtime_pid=$!
          target/debug/snm-backend > /tmp/snm-backend.log 2>&1 &
          backend_pid=$!
          cleanup() {
            kill "$backend_pid" "$runtime_pid" 2>/dev/null || true
            wait "$backend_pid" "$runtime_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:9765/health >/tmp/runtime-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:9765/health >/tmp/runtime-health.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SNM_RUNTIME_TOKEN}" \
            http://127.0.0.1:9765/v1/capabilities >/tmp/runtime-capabilities.json

          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/tmp/backend-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/health >/tmp/backend-health.json
          curl --fail --silent --show-error http://127.0.0.1:8080/ready >/tmp/backend-ready.json
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/system >/tmp/backend-system.json

          curl --fail --silent --show-error \
            -c /tmp/auth.cookies \
            -H 'content-type: application/json' \
            --data '{"organizationSlug":"ci-smoke","email":"admin@ci.invalid","password":"CI-only-Strong-Password-2026!"}' \
            http://127.0.0.1:8080/api/v1/auth/login >/tmp/login.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          runtime = json.loads(Path('/tmp/runtime-health.json').read_text())
          capabilities = json.loads(Path('/tmp/runtime-capabilities.json').read_text())
          backend = json.loads(Path('/tmp/backend-health.json').read_text())
          ready = json.loads(Path('/tmp/backend-ready.json').read_text())
          system = json.loads(Path('/tmp/backend-system.json').read_text())
          login = json.loads(Path('/tmp/login.json').read_text())

          assert runtime['status'] == 'ok'
          assert 'runtime.capabilities.read' in capabilities['capabilities']
          assert 'network.tcp.connect' in capabilities['capabilities']
          assert backend['status'] == 'ok'
          assert ready['database'] == 'ready'
          assert ready['redis'] == 'ready'
          assert ready['runtime'] == 'ready'
          assert ready['appliedMigrations'] >= 9
          assert system['name'] == 'Seven Network Manager'
          assert system['deploymentMode'] == 'production-mvp-onprem'
          assert login['tokenType'] == 'Bearer'
          assert login['expiresInSeconds'] == 600
          assert login['accessToken']
          assert login['csrfToken'].startswith('csrf_')
          Path('/tmp/access-1').write_text(login['accessToken'])
          Path('/tmp/csrf-1').write_text(login['csrfToken'])
          PY

          access_1="$(cat /tmp/access-1)"
          csrf_1="$(cat /tmp/csrf-1)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${access_1}" \
            http://127.0.0.1:8080/api/v1/auth/me >/tmp/me-1.json

          curl --fail --silent --show-error \
            -b /tmp/auth.cookies -c /tmp/auth.cookies \
            -H "x-snm-csrf: ${csrf_1}" \
            -X POST http://127.0.0.1:8080/api/v1/auth/refresh >/tmp/refresh.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          first = Path('/tmp/access-1').read_text()
          me = json.loads(Path('/tmp/me-1.json').read_text())
          refreshed = json.loads(Path('/tmp/refresh.json').read_text())
          assert me['permissions']
          assert 'devices.view' in me['permissions']
          assert refreshed['accessToken'] != first
          assert refreshed['csrfToken'].startswith('csrf_')
          Path('/tmp/access-2').write_text(refreshed['accessToken'])
          Path('/tmp/csrf-2').write_text(refreshed['csrfToken'])
          PY

          access_2="$(cat /tmp/access-2)"
          csrf_2="$(cat /tmp/csrf-2)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${access_2}" \
            http://127.0.0.1:8080/api/v1/auth/me >/tmp/me-2.json

          curl --fail --silent --show-error \
            -b /tmp/auth.cookies -c /tmp/auth.cookies \
            -H "x-snm-csrf: ${csrf_2}" \
            -X POST http://127.0.0.1:8080/api/v1/auth/logout >/dev/null

          status="$(curl --silent --output /tmp/me-after-logout.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${access_2}" \
            http://127.0.0.1:8080/api/v1/auth/me)"
          test "$status" = "401"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          test "$(pnpm --version)" = "11.21.0"
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @seven-network-manager/frontend typecheck
      - name: Lint
        run: pnpm --filter @seven-network-manager/frontend lint
      - name: Build
        run: pnpm --filter @seven-network-manager/frontend build
