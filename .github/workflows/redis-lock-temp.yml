name: Temporary Redis graph validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Resolve canonical Cargo graph
        run: cargo generate-lockfile
      - name: Canonical Rust formatting
        run: cargo fmt --all
      - name: Clippy as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Remove temporary workflow and commit validated graph
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/redis-lock-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock apps crates .github/workflows/redis-lock-temp.yml
          git commit -m 'chore: validate Redis coordination graph'
          git push origin HEAD:${{ github.head_ref }}
