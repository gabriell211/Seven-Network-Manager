name: Temporary roadmap sync

on:
  push:
    branches: [agent/foundation-c0-c1]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/foundation-c0-c1
          fetch-depth: 0
      - name: Generate issue mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_roadmap.py
      - name: Validate issue mirror
        run: python3 scripts/validate_roadmap.py
      - name: Commit generated manifest and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sync-roadmap-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap.json .github/workflows/sync-roadmap-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: materialize machine-readable issue mirror roadmap'
          git push origin HEAD:agent/foundation-c0-c1
