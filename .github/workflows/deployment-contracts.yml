name: deployment-contracts

on:
  pull_request:
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: snm-ci-only-password
      SNM_RUNTIME_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef
      SNM_ACCESS_TOKEN_KEY: abcdef0123456789abcdef0123456789abcdef0123456789
      MONGO_INITDB_ROOT_PASSWORD: snm-ci-only-mongo-password
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository invariants
        run: python3 scripts/validate_repo.py
      - name: Compile operational scripts
        run: python3 -m py_compile scripts/bootstrap_env.py scripts/snm_stack.py scripts/validate_repo.py
      - name: Validate base Compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate Linux L2 Compose merge
        run: docker compose -f docker-compose.yml -f docker-compose.l2.yml config --quiet
      - name: Prove destructive reset is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/snm_stack.py reset >/tmp/reset.out 2>/tmp/reset.err; then
            echo "reset unexpectedly succeeded without --confirm-reset" >&2
            exit 1
          fi
          grep -q -- "--confirm-reset" /tmp/reset.err
