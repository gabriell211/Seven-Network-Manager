name: Temporary Rust formatter

on:
  push:
    branches: [agent/foundation-c0-c1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/foundation-c0-c1
          fetch-depth: 0
      - name: Resolve pinned Rust toolchain
        run: rustup show
      - name: Apply canonical formatting
        run: cargo fmt --all
      - name: Commit formatting and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-rust-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs' .github/workflows/format-rust-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: apply canonical rustfmt'
          git push origin HEAD:agent/foundation-c0-c1
