name: Temporary Rust formatter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Resolve pinned Rust toolchain
        run: rustup show
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.rs'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply rustfmt across roadmap domain modules'
          git push origin HEAD:${{ github.head_ref }}
