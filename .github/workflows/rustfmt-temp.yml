name: Temporary rustfmt applicator

on:
  push:
    branches: [agent/foundation-c0-c1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/foundation-c0-c1
          fetch-depth: 0
      - name: Apply pinned rustfmt
        run: cargo fmt --all
      - name: Commit formatting and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rustfmt-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps crates .github/workflows/rustfmt-temp.yml
          git commit -m 'style: apply pinned rustfmt'
          git push origin HEAD:agent/foundation-c0-c1
