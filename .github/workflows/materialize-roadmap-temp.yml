name: Temporary roadmap materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: read

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/foundation-c0-c1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Generate issue mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_roadmap.py
      - name: Validate issue mirror
        run: python3 scripts/validate_roadmap.py
      - name: Commit manifest and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-roadmap-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap.json .github/workflows/materialize-roadmap-temp.yml
          git commit -m 'docs: materialize exact issue mirror roadmap'
          git push origin HEAD:${{ github.head_ref }}
