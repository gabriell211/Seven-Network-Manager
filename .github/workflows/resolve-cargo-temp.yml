name: Temporary Cargo lock resolver

on:
  push:
    branches: [agent/foundation-c0-c1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/foundation-c0-c1
          fetch-depth: 0
      - name: Resolve pinned toolchain
        run: rustup show
      - name: Resolve dependency graph
        run: cargo generate-lockfile
      - name: Check dependency tree
        run: cargo tree --workspace --locked > /tmp/cargo-tree.txt
      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/resolve-cargo-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/resolve-cargo-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: lock postgres persistence dependencies'
          git push origin HEAD:agent/foundation-c0-c1
