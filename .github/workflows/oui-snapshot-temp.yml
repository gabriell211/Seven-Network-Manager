name: oui-snapshot-temp

on:
  push:
    branches: ["agent/frontend-product-shell"]

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/frontend-product-shell
          fetch-depth: 0
      - name: Download official IEEE assignments
        run: python scripts/update_ieee_oui.py
      - name: Validate snapshot is populated
        shell: python
        run: |
          import csv, json
          from pathlib import Path
          rows = list(csv.DictReader(Path('data/oui/ieee.csv').open(encoding='utf-8')))
          metadata = json.loads(Path('data/oui/metadata.json').read_text(encoding='utf-8'))
          assert len(rows) > 10000, len(rows)
          assert metadata['recordCount'] == len(rows)
          assert {source['registry'] for source in metadata['sources']} == {'MA-L','MA-M','MA-S'}
      - name: Commit versioned snapshot
        run: |
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add data/oui/ieee.csv data/oui/metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update versioned IEEE OUI snapshot"
          git push origin HEAD:agent/frontend-product-shell
