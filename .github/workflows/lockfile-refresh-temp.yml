name: Temporary Rust lockfile refresh

on:
  push:
    branches: [agent/foundation-c0-c1]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/foundation-c0-c1
          fetch-depth: 0
      - name: Generate canonical Cargo lockfile
        run: cargo generate-lockfile
      - name: Verify locked dependency graph
        run: cargo check --workspace --all-targets --locked
      - name: Commit lockfile and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lockfile-refresh-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/lockfile-refresh-temp.yml
          git commit -m 'chore: lock persistent authentication dependencies'
          git push origin HEAD:agent/foundation-c0-c1
