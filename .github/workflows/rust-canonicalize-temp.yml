name: rust-canonicalize-temp

on:
  push:
    branches: ["agent/frontend-product-shell"]

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/frontend-product-shell
          fetch-depth: 0
      - name: Resolve pinned Rust toolchain
        run: rustup show
      - name: Canonicalize lockfile and formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all
          rm .github/workflows/rust-canonicalize-temp.yml
      - name: Commit canonical workspace state
        run: |
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add Cargo.lock Cargo.toml apps crates .github/workflows/rust-canonicalize-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: canonicalize Rust workspace"
          git push origin HEAD:agent/frontend-product-shell
