name: Temporary C1 store validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: snm
          POSTGRES_PASSWORD: snm-c1-validation
          POSTGRES_DB: snm_c1_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snm -d snm_c1_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://snm:snm-c1-validation@127.0.0.1:5432/snm_c1_validation
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Resolve canonical Cargo graph
        run: cargo generate-lockfile
      - name: Canonical Rust formatting
        run: cargo fmt --all
      - name: Test complete workspace against PostgreSQL
        run: cargo test --workspace --all-targets --locked
      - name: Clippy as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit validated graph and formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock apps crates
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: validate C1 security persistence stores'
          git push origin HEAD:${{ github.head_ref }}
