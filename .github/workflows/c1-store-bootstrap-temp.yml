name: Temporary C1 store validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: snm
          POSTGRES_PASSWORD: snm-c1-validation
          POSTGRES_DB: snm_c1_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snm -d snm_c1_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://snm:snm-c1-validation@127.0.0.1:5432/snm_c1_validation
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair inventory validation fixtures and search normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          principal_paths = [
              Path('crates/inventory-store/src/lib.rs'),
              Path('crates/inventory-store/tests/search.rs'),
          ]
          principal_pattern = re.compile(
              r'(?m)^(?P<indent>\s*)actor_type: AuditActorType::User,\n'
              r'(?P=indent)actor_id: Some\(Uuid::now_v7\(\)\),\n'
              r'(?P=indent)session_id: Some\(Uuid::now_v7\(\)\),'
          )
          for path in principal_paths:
              text = path.read_text()
              def principal_replacement(match: re.Match[str]) -> str:
                  indent = match.group('indent')
                  return (
                      f'{indent}actor_type: AuditActorType::System,\n'
                      f'{indent}actor_id: None,\n'
                      f'{indent}session_id: None,'
                  )
              updated, count = principal_pattern.subn(principal_replacement, text)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected exactly one inventory test principal block, found {count}'
                  )
              path.write_text(updated)

          inventory_store = Path('crates/inventory-store/src/lib.rs')
          text = inventory_store.read_text()
          old = '                builder.push(" OR di.normalized_value LIKE ");'
          new = (
              '                builder.push(\n'
              '                    " OR regexp_replace(di.normalized_value, \'[^a-z0-9]\', \'\', \'g\') LIKE ",\n'
              '                );'
          )
          if text.count(old) != 1:
              raise SystemExit(
                  f'{inventory_store}: expected exactly one normalized identifier search clause'
              )
          inventory_store.write_text(text.replace(old, new, 1))
          PY
      - name: Resolve canonical Cargo graph
        run: cargo generate-lockfile
      - name: Canonical Rust formatting
        run: cargo fmt --all
      - name: Test complete workspace against PostgreSQL
        run: cargo test --workspace --all-targets --locked
      - name: Clippy as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit validated graph and formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock apps crates
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: validate C1 security persistence stores'
          git push origin HEAD:${{ github.head_ref }}
