name: Temporary auth bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: snm
          POSTGRES_PASSWORD: snm-auth-bootstrap
          POSTGRES_DB: snm_auth_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snm -d snm_auth_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://snm:snm-auth-bootstrap@127.0.0.1:5432/snm_auth_bootstrap
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Resolve complete Rust graph
        run: cargo generate-lockfile
      - name: Finalize authentication lint fixes
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^enum AuthError/pub(crate) enum AuthError/' apps/backend/src/auth.rs
          sed -i 's/signing_secret\.as_bytes()\.len()/signing_secret.len()/' apps/backend/src/auth.rs
      - name: Canonical Rust formatting
        run: cargo fmt --all
      - name: Test workspace with PostgreSQL
        run: cargo test --workspace --all-targets --locked
      - name: Clippy as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit validated integration and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/auth-bootstrap-temp.yml .github/workflows/lockfile-refresh-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock apps crates .github/workflows/auth-bootstrap-temp.yml .github/workflows/lockfile-refresh-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: validate persistent authentication integration'
          git push origin HEAD:${{ github.head_ref }}
