name: Temporary auth bootstrap

on:
  push:
    branches: [agent/foundation-c0-c1]
    paths:
      - 'apps/backend/**'
      - 'crates/security/**'
      - 'migrations/**'
      - '.github/workflows/auth-bootstrap-temp.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: snm
          POSTGRES_PASSWORD: snm-auth-bootstrap
          POSTGRES_DB: snm_auth_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snm -d snm_auth_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://snm:snm-auth-bootstrap@127.0.0.1:5432/snm_auth_bootstrap
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/foundation-c0-c1
          fetch-depth: 0
      - name: Keep auth error type usable by parent module
        run: sed -i 's/^enum AuthError/pub(crate) enum AuthError/' apps/backend/src/auth.rs
      - name: Canonical Rust formatting
        run: cargo fmt --all
      - name: Test workspace with PostgreSQL
        run: cargo test --workspace --all-targets --locked
      - name: Clippy as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit validated auth integration and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/auth-bootstrap-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs' .github/workflows/auth-bootstrap-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: validate persistent auth integration'
          git push origin HEAD:agent/foundation-c0-c1
