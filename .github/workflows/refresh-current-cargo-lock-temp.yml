name: Temporary Cargo lock refresh

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Resolve pinned Rust toolchain
        run: rustup show
      - name: Refresh Cargo lock
        run: cargo generate-lockfile
      - name: Publish lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: refresh Cargo lock for current workspace'
          git push origin HEAD:${{ github.head_ref }}
